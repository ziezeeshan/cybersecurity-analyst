title: PsExec Lateral Movement
id: 7e7e1de0-4e0a-4c5c-9ac8-psexec-lateral
description: Detects use of PsExec for remote lateral movement via PSEXESVC.exe
status: experimental
author: Muhammad Zeeshan
date: 2025/07/09
logsource:
  product: windows
  service: sysmon
  definition: 'EventID 1 - Process creation'
detection:
  selection:
    EventID: 1
    Image|endswith: '\PSEXESVC.exe'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.lateral_movement
  - attack.t1021.002
  - PsExec
references:
  - https://attack.mitre.org/techniques/T1021/002/
